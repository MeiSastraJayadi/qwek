name: qwek

services:
  api:
    image: ${API_IMAGE:-qwek:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:?CONNECTION_STRING is required}
      Jwt__Issuer: ${JWT_ISSUER:-Qwek}
      Jwt__Audience: ${JWT_AUDIENCE:-Qwek}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required, copy .env.example to .env and set it}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
      - logs:/app/LogFiles

volumes:
  uploads:
  logs:
