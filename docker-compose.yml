name: qwek

services:
  api:
    image: ${API_IMAGE:-qwek:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:?CONNECTION_STRING is required}
      Jwt__Issuer: ${JWT_ISSUER:-qwek}
      Jwt__Audience: ${JWT_AUDIENCE:-qwek}
      Jwt__Key: ${JWT_KEY:-dev-only-change-me-jwt-signing-key-32chars}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
      - logs:/app/LogFiles

volumes:
  uploads:
  logs:
