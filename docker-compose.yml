name: qwek

services:
  api:
    image: ${API_IMAGE:-qwek:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:?CONNECTION_STRING is required}
      Jwt__Issuer: ${JWT_ISSUER:-Qwek}
      Jwt__Audience: ${JWT_AUDIENCE:-Qwek}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required, copy .env.example to .env and set it}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__Private: ${STORAGE_PRIVATE:-false}
      Storage__PrivateBasePath: ${STORAGE_PRIVATE_BASE_PATH:-/api/files}
      Storage__MaxTotalBytes: ${STORAGE_MAX_TOTAL_BYTES:-9000000000}
      Storage__MaxAttachmentBytes: ${STORAGE_MAX_ATTACHMENT_BYTES:-26214400}
      Storage__MaxAvatarBytes: ${STORAGE_MAX_AVATAR_BYTES:-5242880}
      Storage__Local__Path: ${STORAGE_LOCAL_PATH:-uploads}
      Storage__Local__PublicBasePath: ${STORAGE_LOCAL_PUBLIC_BASE_PATH:-/uploads}
      Storage__S3__Bucket: ${STORAGE_S3_BUCKET:-}
      Storage__S3__Endpoint: ${STORAGE_S3_ENDPOINT:-}
      Storage__S3__Region: ${STORAGE_S3_REGION:-auto}
      Storage__S3__AccessKeyId: ${STORAGE_S3_ACCESS_KEY_ID:-}
      Storage__S3__SecretAccessKey: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      Storage__S3__PublicBaseUrl: ${STORAGE_S3_PUBLIC_BASE_URL:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
      - logs:/app/LogFiles

volumes:
  uploads:
  logs:
